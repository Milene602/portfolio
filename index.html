<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3e8ff;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            background-color: white;
            width: 90%;
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px rgba(128, 0, 128, 0.2);
            animation: aparecer 1s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #4b0082;
        }

        h2 {
            color: #6a0dad;
        }

        p {
            color: #333;
        }

        img.foto {
            width: 100%;
            max-width: 150px;
            border-radius: 50%;
            margin-top: 15px;
            border: 4px solid #6a0dad;
            transition: transform 0.3s ease;
        }

        img.foto:hover {
            transform: scale(1.1);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background-color: #e9d5ff;
            margin: 8px;
            padding: 10px;
            border-radius: 8px;
            color: #4b0082;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        li:hover {
            background-color: #d8b4fe;
        }

        li.ativo {
            background-color: #f9a8d4;
            color: white;
        }

        #jigglypuff {
            position: absolute;
            width: 80px;
            display: none;
            transition: all 0.3s ease;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Meu Portfólio</h1>

        <h2>Sobre mim</h2>
        <p>Meu nome é Milene e estou aprendendo desenvolvimento web.</p>

        <img src="minha-foto.jpeg" alt="Minha foto" class="foto">

        <h2>Minhas habilidades</h2>
        <ul>
            <li onclick="mostrarJiggly(this)">HTML básico</li>
            <li onclick="mostrarJiggly(this)">Lógica de programação</li>
            <li onclick="mostrarJiggly(this)">Estudos em tecnologia</li>
        </ul>

    </div>

    <!-- Jigglypuff -->
    <img id="jigglypuff" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/39.png">

    <script>
        function mostrarJiggly(elemento) {
            let jig = document.getElementById("jigglypuff");

            // remove destaque dos outros
            document.querySelectorAll("li").forEach(li => li.classList.remove("ativo"));

            // adiciona destaque no clicado
            elemento.classList.add("ativo");

            // pega posição do item
            let pos = elemento.getBoundingClientRect();

            // posiciona ao lado
            jig.style.top = (pos.top + window.scrollY) + "px";
            jig.style.left = (pos.right + 10) + "px";

            jig.style.display = "block";

            // some depois
            setTimeout(() => {
                jig.style.display = "none";
            }, 2000);
        }
    </script>

</body>
</html>
