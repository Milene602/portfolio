<!DOCTYPE html>
<html>
<head>
    <title>Meu Portfólio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3e8ff; 
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            background-color: #ffffff;
            width: 60%;
            margin: 50px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px rgba(128, 0, 128, 0.2);
        }

        h1 {
            color: #4b0082;
        }

        h2 {
            color: #6a0dad;
        }

        p {
            color: #333;
        }

        img {
            border-radius: 50%;
            margin-top: 15px;
            border: 4px solid #6a0dad; 
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background-color: #e9d5ff; 
            margin: 8px;
            padding: 10px;
            border-radius: 8px;
            color: #4b0082;
            font-weight: bold;
        }

        li:hover {
            background-color: #d8b4fe;
    </style>

</head>
<body>

    <div class="container">

        <h1>Meu Portfólio</h1>

        <h2>Sobre mim</h2>
        <p>Meu nome é Milene e estou aprendendo desenvolvimento web.</p>

        <img src="minha-foto.jpeg" alt="Minha foto" width="150">

        <h2>Minhas habilidades</h2>
        <ul>
            <li>HTML básico</li>
            <li>Lógica de programação</li>
            <li>Estudos em tecnologia</li>
        </ul>

    </div>

</body>
</html>
