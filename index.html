<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3e8ff;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            background-color: white;
            width: 90%;
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px rgba(128, 0, 128, 0.2);
            animation: aparecer 1s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #4b0082;
        }

        h2 {
            color: #6a0dad;
        }

        p {
            color: #333;
        }

        img.foto {
            width: 100%;
            max-width: 150px;
            border-radius: 50%;
            margin-top: 15px;
            border: 4px solid #6a0dad;
            transition: transform 0.3s ease;
        }

        img.foto:hover {
            transform: scale(1.1);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background-color: #e9d5ff;
            margin: 8px;
            padding: 10px;
            border-radius: 8px;
            color: #4b0082;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        li:hover {
            background-color: #d8b4fe;
            transform: translateX(5px);
        }

        /* Jigglypuff */
        #jigglypuff {
            position: fixed;
            bottom: 20px;
            right: -80px;
            width: 100px;
            transition: right 0.5s ease;
        }

        #olhinhos {
            position: fixed;
            bottom: 110px;
            right: -60px;
            font-size: 30px;
            transition: right 0.5s ease;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Meu Portfólio</h1>

        <h2>Sobre mim</h2>
        <p>Meu nome é Milene e estou aprendendo desenvolvimento web.</p>

        <img src="minha-foto.jpeg" alt="Minha foto" class="foto">

        <h2>Minhas habilidades</h2>
        <ul>
            <li>HTML básico</li>
            <li>Lógica de programação</li>
            <li>Estudos em tecnologia</li>
        </ul>

    </div>

    <!-- Jigglypuff + olhos -->
    <img id="jigglypuff" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/39.png">
    <div id="olhinhos">👀</div>

    <script>
        document.addEventListener("keydown", function() {
            let jig = document.getElementById("jigglypuff");
            let eyes = document.getElementById("olhinhos");

            // aparece
            jig.style.right = "10px";
            eyes.style.right = "30px";

            // some depois
            setTimeout(() => {
                jig.style.right = "-80px";
                eyes.style.right = "-60px";
            }, 2000);
        });
    </script>

</body>
</html>
